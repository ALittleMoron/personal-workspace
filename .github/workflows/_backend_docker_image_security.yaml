name: Backend Docker image security
on:
  workflow_call:
permissions:
  contents: read
jobs:
  backend-docker-image-security:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: make security-backend-docker-image
