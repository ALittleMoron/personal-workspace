[project]
name = "personal-workspace-backend"
version = "0.1.0"
description = "Personal Workspace backend"
authors = [{ name = "Dmitriy Lunev", email = "d.lunev.dev@gmail.com" }]
requires-python = "==3.14.*,<4.0"
license = "AGPL-3.0-only"
dependencies = [
    "aiobotocore>=3.8.0",
    "alembic>=1.18.5",
    "dishka>=1.10.1",
    "ecs-logging>=2.3.0",
    "granian[reload]>=2.7.9",
    "litestar[pydantic,valkey]>=2.24.0",
    "pydantic-settings>=2.14.2",
    "psycopg[binary]>=3.3.4",
    "sentry-sdk[litestar]>=2.66.1",
    "sqlalchemy[asyncio,mypy]>=2.0.51",
    "structlog>=26.1.0",
    "taskiq>=0.12.4",
    "taskiq-redis>=1.2.3",
    "types-aiobotocore-s3>=3.8.0",
    "verbose-http-exceptions[litestar]>=3.0.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "coverage>=7.15.2",
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pip-audit>=2.10.1",
    "pytest==9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.1",
    "vulture>=2.16",
]
local = ["ipython>=9.15.0", "pre-commit>=4.6.1"]

[tool.uv]
package = false
constraint-dependencies = ["aiohttp>=3.14.3"]

[tool.ruff]
output-format = "concise"
lint.select = ["ALL"]
lint.ignore = [
    "ANN10", "B008", "COM812", "CPY001", "D", "FIX", "N805", "PLC0414",
    "PLR0917", "Q000", "RUF001", "RUF002", "RUF003", "RUF012", "S101",
    "TC001", "TC002", "TC003", "TD002", "TD003",
]
line-length = 100
exclude = [
    ".git", ".venv", "__pycache__", "dist", "src/infra/postgresql/alembic",
]

[tool.ruff.lint.per-file-ignores]
"src/**/*.py" = ["PD"]
"tests/**/*.py" = ["ANN201", "ARG002", "FBT", "PLR2004", "PT004", "S101"]
"tests/conftest.py" = ["ANN401", "ARG001"]

[tool.ruff.lint.mccabe]
max-complexity = 11

[tool.ruff.lint.pydocstyle]
convention = "numpy"
ignore-decorators = ["typing.overload"]

[tool.mypy]
mypy_path = ["src"]
plugins = ["pydantic.mypy"]
follow_imports = "silent"
strict = true
disallow_subclassing_any = false
disallow_any_generics = false
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "enum.Enum", "(Protocol):", "(typing.Protocol):", "pragma: no cover",
    "raise NotImplementedError", "if TYPE_CHECKING:", "if typing.TYPE_CHECKING:", "@overload",
]
omit = ["src/main.py", "src/infra/postgresql/alembic/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    "ignore:Core Pydantic V1 functionality isn't compatible with Python 3\\.14 or greater\\.:UserWarning:litestar\\.plugins\\.pydantic\\.utils",
]

[tool.bandit]
exclude = ["tests"]

[tool.bandit.assert_used]
skips = ["*_test.py", "*/test_*.py"]
