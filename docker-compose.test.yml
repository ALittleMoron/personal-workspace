name: personal_workspace_test

services:
  postgres-test:
    image: postgres:18.4-alpine
    user: "70:70"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${DB_USER:-personal_workspace_test}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-personal_workspace_test_password}
      POSTGRES_DB: ${DB_NAME:-personal_workspace_test}
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 10s
      retries: 30
