pid /tmp/personal-workspace-nginx.pid;
worker_processes auto;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    client_body_temp_path /tmp/personal-workspace-client-body;

    map $request_id $content_security_policy {
        default "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'nonce-$request_id'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'";
    }

    server {
        listen 4000;
        server_name _;
        root /usr/share/nginx/html;

        add_header Content-Security-Policy $content_security_policy always;
        sub_filter_types text/html;
        sub_filter '__CSP_NONCE__' '$request_id';
        sub_filter_once off;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /index.html {
            add_header Cache-Control "no-store" always;
            add_header Content-Security-Policy $content_security_policy always;
            try_files /index.html =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
