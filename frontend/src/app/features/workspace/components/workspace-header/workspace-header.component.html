<nav class="navbar nav-blur fixed-top px-4 py-1 border-bottom">
  <div class="container-fluid px-0 gap-3 workspace-header-inner">
    <div
      class="d-flex align-items-center gap-2 flex-shrink-0"
      data-testid="workspace-header-primary"
    >
      <img
        src="/brand/archive-portal-64.png"
        alt=""
        width="32"
        height="32"
        class="d-block flex-shrink-0"
        data-testid="workspace-logo"
      />
      <span
        class="navbar-brand fs-4 text-success fw-bold mb-0 me-0 workspace-title"
        data-testid="workspace-header-title"
      >
        {{ 'workspace.title' | t }}
      </span>
    </div>

    <div class="d-flex align-items-center justify-content-end gap-2 workspace-header-controls">
      <span
        class="workspace-current-user small text-body-secondary text-nowrap"
        data-testid="workspace-current-user"
        [title]="username()"
      >
        {{ 'auth.currentUser' | t }}: {{ username() }}
      </span>

      <button
        type="button"
        class="btn button-inactive btn-sm"
        [disabled]="busy()"
        (click)="requestLogout()"
      >
        @if (busy()) {
          {{ 'auth.logout.submitting' | t }}
        } @else {
          {{ 'auth.logout' | t }}
        }
      </button>

      <button
        type="button"
        class="btn button-inactive btn-sm"
        (click)="toggleTheme()"
        [attr.aria-label]="'shell.theme.toggle' | t"
      >
        {{ toggleLabel() }}
      </button>

      <div
        class="btn-group btn-group-sm"
        role="group"
        [attr.aria-label]="'shell.language.label' | t"
      >
        @for (language of languageOptions(); track language.code) {
          <button
            type="button"
            class="btn"
            [class.button-active]="language.selected"
            [class.button-inactive]="!language.selected"
            [attr.aria-pressed]="language.selected"
            [attr.title]="language.label"
            (click)="switchLanguage(language.code)"
          >
            {{ language.shortLabel }}
          </button>
        }
      </div>
    </div>
  </div>
</nav>
