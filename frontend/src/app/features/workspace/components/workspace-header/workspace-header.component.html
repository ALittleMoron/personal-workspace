<nav class="navbar nav-blur fixed-top px-4 py-1 border-bottom">
  <div class="container-fluid px-0 gap-3 workspace-header-inner">
    <div
      class="d-flex align-items-center gap-2 flex-shrink-0"
      data-testid="workspace-header-primary"
    >
      <img
        src="/brand/archive-portal-64.png"
        alt=""
        width="32"
        height="32"
        class="d-block flex-shrink-0"
        data-testid="workspace-logo"
      />
      <span
        class="navbar-brand fs-4 text-success fw-bold mb-0 me-0 workspace-title"
        data-testid="workspace-header-title"
      >
        {{ 'workspace.title' | t }}
      </span>
    </div>

    <div class="workspace-header-controls">
      <div class="dropdown">
        <button
          type="button"
          class="btn button-inactive btn-sm dropdown-toggle workspace-account-menu-toggle"
          data-testid="workspace-account-menu-toggle"
          [attr.aria-label]="('auth.currentUser' | t) + ': ' + username()"
          [attr.aria-expanded]="menuOpen()"
          popovertarget="workspace-account-menu"
          popovertargetaction="toggle"
          [title]="username()"
        >
          <span class="workspace-account-menu-username">{{ username() }}</span>
        </button>

        <div
          #accountMenu
          id="workspace-account-menu"
          popover="auto"
          class="dropdown-menu dropdown-menu-end"
          data-testid="workspace-account-menu"
          (toggle)="onMenuToggle($event)"
        >
          <button
            type="button"
            class="dropdown-item d-flex align-items-center justify-content-between gap-3"
            (click)="toggleTheme()"
            [attr.aria-label]="'shell.theme.toggle' | t"
          >
            <span>{{ 'shell.theme.toggle' | t }}</span>
            <span class="text-body-secondary small">{{ toggleLabel() }}</span>
          </button>

          <button
            type="button"
            class="dropdown-item d-flex align-items-center justify-content-between gap-3"
            aria-controls="workspace-account-language-options"
            [attr.aria-expanded]="languageMenuOpen()"
            (click)="toggleLanguageMenu()"
          >
            <span>{{ 'shell.language.label' | t }}</span>
            <svg
              class="workspace-account-language-chevron"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m6 9 6 6 6-6"></path>
            </svg>
          </button>

          @if (languageMenuOpen()) {
            <div
              id="workspace-account-language-options"
              class="workspace-account-language-options"
              data-testid="workspace-account-language-options"
            >
              @for (language of languageOptions(); track language.code) {
                <button
                  type="button"
                  class="dropdown-item d-flex align-items-center justify-content-between gap-3"
                  [attr.aria-pressed]="language.selected"
                  [attr.title]="language.label"
                  (click)="switchLanguage(language.code)"
                >
                  <span>{{ language.shortLabel }}</span>
                  @if (language.selected) {
                    <svg
                      aria-hidden="true"
                      xmlns="http://www.w3.org/2000/svg"
                      width="16"
                      height="16"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2.5"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="m5 12 4 4L19 6"></path>
                    </svg>
                  }
                </button>
              }
            </div>
          }

          <hr class="dropdown-divider" />

          <button
            type="button"
            class="btn btn-link btn-sm link-danger text-decoration-none text-start w-100 px-3 py-2"
            data-testid="workspace-account-logout"
            [disabled]="busy()"
            [attr.aria-busy]="busy()"
            (click)="requestLogout()"
          >
            @if (busy()) {
              {{ 'auth.logout.submitting' | t }}
            } @else {
              {{ 'auth.logout' | t }}
            }
          </button>
        </div>
      </div>
    </div>
  </div>
</nav>
