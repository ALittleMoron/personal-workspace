<form class="login-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="mb-3">
    <label class="form-label" for="login-username">
      {{ 'auth.login.username' | t }}
      <span class="required-marker text-danger" aria-hidden="true">*</span>
    </label>
    <input
      #usernameInput
      id="login-username"
      class="form-control"
      type="text"
      name="username"
      formControlName="username"
      autocomplete="username"
      required
      [class.is-invalid]="form.controls.username.touched && form.controls.username.invalid"
      [attr.aria-invalid]="form.controls.username.touched && form.controls.username.invalid"
    />
  </div>

  <div class="mb-3">
    <label class="form-label" for="login-password">
      {{ 'auth.login.password' | t }}
      <span class="required-marker text-danger" aria-hidden="true">*</span>
    </label>
    <input
      id="login-password"
      class="form-control"
      type="password"
      name="password"
      formControlName="password"
      autocomplete="current-password"
      required
      [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid"
      [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
    />
  </div>

  @if (errorKey(); as error) {
    <p class="text-danger mb-3" role="alert">{{ error | t }}</p>
  }

  <button class="btn btn-primary w-100" type="submit" [disabled]="busy()">
    @if (busy()) {
      {{ 'auth.login.submitting' | t }}
    } @else {
      {{ 'auth.login.submit' | t }}
    }
  </button>
</form>
