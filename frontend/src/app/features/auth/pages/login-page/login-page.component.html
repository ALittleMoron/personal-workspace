<main
  class="login-page gradient-body d-flex align-items-center justify-content-center min-vh-100 p-3"
>
  <section class="login-page__card card border-0 shadow-sm w-100" aria-labelledby="login-title">
    <div class="card-body p-4 p-sm-5">
      <h1 id="login-title" class="h3 mb-2">{{ 'auth.login.title' | t }}</h1>
      <p class="text-body-secondary mb-4">{{ 'auth.login.subtitle' | t }}</p>
      <app-login-form (authenticated)="onLogin()" />
    </div>
  </section>
</main>
